services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pai-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: pai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: